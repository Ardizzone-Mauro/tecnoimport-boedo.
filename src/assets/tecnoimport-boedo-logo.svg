<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">TecnoImport Boedo</title>
  <desc id="desc">Logo de TecnoImport Boedo: carrito de compras tecnológico con un microchip.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2463"/>
      <stop offset="1" stop-color="#0578ff"/>
    </linearGradient>
  </defs>

  <!-- carrito tecnológico -->
  <g fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 90h62c14 0 26 9 30 22l52 177c5 17 20 29 38 29h198" stroke-width="30"/>
    <path d="M180 133h274l-31 150H222" stroke-width="25"/>
    <path d="M74 163h72M79 214h83M88 265h91" stroke-width="23"/>
  </g>
  <circle cx="255" cy="375" r="27" fill="#0a2463"/>
  <circle cx="392" cy="375" r="27" fill="#0a2463"/>

  <!-- microchip y circuitos -->
  <g fill="none" stroke="#18b9ff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="286" y="175" width="76" height="76" rx="14" fill="#087ce9" stroke-width="8"/>
    <path d="M286 198h-37v-34h-32M362 198h35v-32h27M286 228h-42v34h-26M362 229h39v36h31" stroke-width="9"/>
    <circle cx="211" cy="164" r="11" fill="#18b9ff"/>
    <circle cx="424" cy="166" r="11" fill="#18b9ff"/>
    <circle cx="218" cy="262" r="11" fill="#18b9ff"/>
    <circle cx="432" cy="265" r="11" fill="#18b9ff"/>
  </g>

  <!-- marca -->
  <text x="500" y="255" fill="#071f5c" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="800" letter-spacing="-7">Tecno</text>
  <text x="875" y="255" fill="#0782ff" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="800" letter-spacing="-7">Import</text>
  <text x="505" y="370" fill="#ff9f00" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-5">Boedo</text>
</svg>
